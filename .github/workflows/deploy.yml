name: Build & Deploy to bttspredict.com

on:
  push:
    branches:
      - main
  schedule:
    # Refresh every 3 h — the diff-based FTP upload (see ftp-diff.mjs) keeps each
    # run short, so completed matches are replaced promptly without overlap.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "full = pronos+Gemini+build+FTP | code = build+FTP seulement (rapide)"
        required: false
        default: full
        type: choice
        options:
          - full
          - code
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Les runs durent 2 à 4 h (miroir FTP complet) alors que le cron passe toutes les
# 4 h : sans verrou, deux déploiements pouvaient se chevaucher (sessions FTP
# concurrentes, git push en échec avalé). On sérialise les runs.
concurrency:
  group: deploy-${{ github.ref }}
  # Un nouveau push/run annule l'ancien : un seul déploiement utile, pas de file.
  cancel-in-progress: true

jobs:
  pull-request-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Run tests
        run: npm test
      - name: Test narrative enrichment guards
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Build static export
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # GA4 — définir la variable de dépôt "NEXT_PUBLIC_GA_ID"
          # (Settings > Secrets and variables > Actions > Variables).
          # Si absente, le build reste fonctionnel, sans tracking.
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

  deploy:
    # Jamais de déploiement depuis une branche de travail ou un tag.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prune old predictions archives (keep 90)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 2
        run: node scripts/prune-archives.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Update predictions (ESPN API)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 5
        run: node scripts/quick-update-predictions.mjs

      - name: Validate fresh predictions before enrichment
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: node scripts/validate-predictions.mjs public/predictions.json --require-timestamp

      - name: Setup Python for Gemini enrichment
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install google-genai
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: pip install google-genai

      - name: Enrichir les pronostics avec Gemini
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        timeout-minutes: 10
        run: python scripts/enrich_predictions.py
        continue-on-error: true

      - name: Finalize enriched immutable publication
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: node scripts/finalize-predictions.mjs
      - name: Verify results (GOLD priority — free ESPN, no API key)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        id: verify
        timeout-minutes: 20
        run: node scripts/verify-results.mjs
        continue-on-error: true

      - name: Update win history (runs even if verify timed out)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 3
        run: node scripts/update-win-history.mjs

      - name: Verify public history exclusions applied
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: |
          node -e "
            const fs=require('fs');
            const wh=JSON.parse(fs.readFileSync('public/win-history.json','utf8'));
            const ex=JSON.parse(fs.readFileSync('public/history-exclusions.json','utf8'));
            const keys=new Set((ex.entries||[]).map(e=>e.key||e));
            const lost=wh.history.filter(h=>h.status==='LOST');
            const leaked=lost.filter(h=>keys.has(h.date+'|'+h.match+'|'+(h.market||'btts')));
            console.log('stats', wh.stats.total, wh.stats.won, wh.stats.lost, wh.stats.rate+'%');
            if (leaked.length) {
              console.error('FAIL: '+leaked.length+' LOST exclus encore dans history');
              process.exit(1);
            }
            console.log('OK exclusions respectées ('+keys.size+' clés)');
          "

      - name: Update transfers
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 2
        run: node scripts/scrape-transfers.mjs
        continue-on-error: true

      - name: Run regression tests
        run: npm test
      - name: Test narrative enrichment guards
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Run lint
        run: npm run lint
      - name: Run typecheck
        run: npx tsc --noEmit
      - name: Update open licensed team context
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 5
        run: node scripts/update-team-context.mjs
        continue-on-error: true
      - name: Validate predictions dataset before build
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: node scripts/validate-predictions.mjs public/predictions.json --require-timestamp

      - name: Build static export
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # GA4 — définir la variable de dépôt "NEXT_PUBLIC_GA_ID"
          # (Settings > Secrets and variables > Actions > Variables).
          # Si absente, le build reste fonctionnel, sans tracking.
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

      - name: Copy routing files
        run: |
          cp public/404.html out/404.html 2>/dev/null || true
          cp out/index.html out/200.html 2>/dev/null || true
          cp public/_redirects out/_redirects 2>/dev/null || true
          cp public/.htaccess out/.htaccess 2>/dev/null || true
          cp public/robots.txt out/robots.txt 2>/dev/null || true
          cp public/sitemap.xml out/sitemap.xml 2>/dev/null || true

      - name: Commit data
        continue-on-error: true
        run: |
          git config --local user.email "bot@bttspredict.com"
          git config --local user.name "BTTSPredict Bot"
          git add public/predictions.json public/win-history.json public/history-exclusions.json public/transfers.json public/vip-combos.json public/predictions-archive/ 2>/dev/null || git add public/predictions.json public/win-history.json public/transfers.json public/vip-combos.json public/predictions-archive/
          if [ -f public/team-context.json ]; then git add public/team-context.json; fi
          if [ -d public/team-media ]; then git add public/team-media/; fi
          git diff --staged --quiet || git commit -m "chore: auto-update data"
          git push || echo "No changes"

      - name: Install lftp (for FTP cleanup)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Free server disk (purge stale _next/, match/ and archives)
        continue-on-error: true
        timeout-minutes: 90
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          # Le serveur LWS a un quota disque limité (erreurs "553 Disk quota
          # exceeded" le 15/09/2026). Sans --delete sur le miroir principal, les
          # builds précédents (_next/<buildId>/ + chunks hashés) et les pages
          # /match/ éphémères (14 jours par design) s'accumulaient sans jamais
          # être supprimés — l'ancien step de nettoyage n'a d'ailleurs jamais
          # fonctionné (listing `cls` impossible sur ce serveur).
          # Stratégie : miroir inverse ciblé avec --delete, limité aux seuls
          # répertoires dont tout le contenu est généré par le build. Tout
          # fichier distant absent du build local y est supprimé.
          purge() {
            local src="$1" dst="$2" min="$3"
            local count
            count=$(find "$src" -type f 2>/dev/null | wc -l)
            if [ "$count" -lt "$min" ]; then
              echo "⏭️ Skip $dst (build local insuffisant: $count fichiers)"
              return 0
            fi
            echo "🧹 Purge $dst — suppression de tout ce qui n'est plus dans le build"
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
              set ssl:verify no
              set net:timeout 60
              set net:max-retries 3
              mirror --reverse --delete --no-perms --verbose --parallel=2 $src $dst
              bye
            " || echo "⚠️ Purge $dst: erreur ignorée (le déploiement continue)"
          }
          purge out/_next/ ./_next/ 10
          purge out/match/ ./match/ 10
          purge out/en/match/ ./en/match/ 10
          purge out/ar/match/ ./ar/match/ 10
          purge out/predictions-archive/ ./predictions-archive/ 60
          echo "✓ Purge terminée"

      # ═══ DÉPLOIEMENT DIFFÉRENTIEL (ftp-diff.mjs) ═══
      # Le miroir complet (~10 000 fichiers, parallel=1) prenait des heures et
      # maintenait le site dans un état incohérent pendant l'upload (les matchs
      # semblaient « disparaître »). On ne transfère désormais que les fichiers
      # dont le sha256 a changé depuis le déploiement précédent — manifeste
      # versionné sur le serveur. Repli automatique : parallel=1 puis miroir
      # complet historique si le diff échoue.
      - name: Deploy to bttspredict.com via FTP (manifest diff + fallbacks)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          ftp_run() {
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "$1"
          }
          SETTINGS="set ssl:verify no; set net:timeout 60; set net:max-retries 5; set mirror:use-pget-n 1"
          # 0. Manifeste du déploiement précédent — base du diff. Absent ou
          #    illisible → prepare liste tous les fichiers (miroir complet).
          if ! ftp_run "$SETTINGS; set net:timeout 30; set net:max-retries 2; get ./deploy-manifest.json -o out/deploy-manifest.prev.json; bye"; then
            echo "Aucun manifeste distant (premier déploiement diff) — diff complet."
          fi
          # 1. Liste des fichiers modifiés/nouveaux (sha256, un pattern regex par ligne).
          node scripts/ftp-diff.mjs prepare
          # 2. Miroir DIFF — uniquement ces fichiers. parallel=4 est sûr sur des
          #    fichiers existants ; en cas d'échec (550 race sur un nouveau dossier
          #    /match/), repli parallel=1 puis miroir complet historique.
          if [ -s out/deploy-list.txt ]; then
            if ! ftp_run "$SETTINGS; mirror --reverse --no-perms --overwrite --verbose --parallel=4 --include-from-file=out/deploy-list.txt --exclude '^\\.htaccess$' out/ ./; bye"; then
              echo "::warning::Miroir diff en échec — repli parallel=1"
              if ! ftp_run "$SETTINGS; mirror --reverse --no-perms --overwrite --verbose --parallel=1 --include-from-file=out/deploy-list.txt --exclude '^\\.htaccess$' out/ ./; bye"; then
                echo "::warning::Miroir diff toujours en échec — repli sur miroir complet historique"
                ftp_run "$SETTINGS; mirror --reverse --no-perms --overwrite --verbose --parallel=1 --exclude '^\\.htaccess$' out/ ./; bye"
              fi
            fi
          else
            echo "Aucun fichier modifié — rien à transférer."
          fi
          # 3. Manifeste mis en ligne — le prochain run différera contre lui.
          if ! ftp_run "$SETTINGS; put out/deploy-manifest.json -o ./deploy-manifest.json; bye"; then
            echo "::warning::Manifeste non déployé — le prochain run effectuera un diff complet (plus lent mais sûr)."
          fi

      - name: Deploy .htaccess (rm + rename — évite le 553 Permission denied)
        continue-on-error: true
        timeout-minutes: 5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          # Le .htaccess distant refuse l'écrasement direct (STOR → 553 Permission
          # denied depuis le 15/09/2026). Comme rm ne dépend que des droits du
          # répertoire parent (pas des permissions du fichier), on uploade sous un
          # nom temporaire, on supprime l'ancien puis on renomme.
          if lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
            set ssl:verify no
            set net:timeout 60
            set net:max-retries 3
            rm -f ./.htaccess.deploy
            put out/.htaccess -o ./.htaccess.deploy
            rm -f ./.htaccess
            mv ./.htaccess.deploy ./.htaccess
            bye
          "; then
            echo "✓ .htaccess déployé (upload temporaire + rm + rename)"
          else
            echo "⚠️ rm+rename refusé — tentative STOR direct"
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
              set ssl:verify no
              set net:timeout 60
              set net:max-retries 3
              put out/.htaccess -o ./.htaccess
              bye
            " \
              || echo "::warning::.htaccess non déployable via FTP — corriger chmod/propriétaire côté LWS (ou supprimer le fichier via le panel)"
          fi

      - name: Notify Bing via IndexNow
        if: success()
        run: node scripts/submit-indexnow.mjs
        continue-on-error: true
