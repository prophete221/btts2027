name: Build & Deploy to bttspredict.com

on:
  push:
    branches:
      - main
  schedule:
    # Refresh predictions six times daily so completed matches are replaced promptly.
    - cron: '0 */4 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Les runs durent 2 à 4 h (miroir FTP complet) alors que le cron passe toutes les
# 4 h : sans verrou, deux déploiements pouvaient se chevaucher (sessions FTP
# concurrentes, git push en échec avalé). On sérialise les runs.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pull-request-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Run tests
        run: npm test
      - name: Test narrative enrichment guards
        run: python3 -m unittest discover -s tests -p 'enrich_predictions_test.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Build static export
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # GA4 — définir la variable de dépôt "NEXT_PUBLIC_GA_ID"
          # (Settings > Secrets and variables > Actions > Variables).
          # Si absente, le build reste fonctionnel, sans tracking.
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

  deploy:
    # Jamais de déploiement depuis une branche de travail ou un tag.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prune old predictions archives (keep 90)
        timeout-minutes: 2
        run: node scripts/prune-archives.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Update predictions (ESPN API)
        timeout-minutes: 5
        run: node scripts/quick-update-predictions.mjs

      - name: Validate fresh predictions before enrichment
        run: node scripts/validate-predictions.mjs public/predictions.json --require-timestamp

      - name: Setup Python for Gemini enrichment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install google-genai
        run: pip install google-genai

      - name: Enrichir les pronostics avec Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        timeout-minutes: 10
        run: python scripts/enrich_predictions.py
        continue-on-error: true

      - name: Finalize enriched immutable publication
        run: node scripts/finalize-predictions.mjs
      - name: Verify results (GOLD priority — free ESPN, no API key)
        id: verify
        timeout-minutes: 20
        run: node scripts/verify-results.mjs
        continue-on-error: true

      - name: Update win history (runs even if verify timed out)
        timeout-minutes: 3
        run: node scripts/update-win-history.mjs

      - name: Update transfers
        timeout-minutes: 2
        run: node scripts/scrape-transfers.mjs
        continue-on-error: true

      - name: Run regression tests
        run: npm test
      - name: Test narrative enrichment guards
        run: python3 -m unittest discover -s tests -p 'enrich_predictions_test.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Run lint
        run: npm run lint
      - name: Run typecheck
        run: npx tsc --noEmit
      - name: Update open licensed team context
        timeout-minutes: 5
        run: node scripts/update-team-context.mjs
        continue-on-error: true
      - name: Validate predictions dataset before build
        run: node scripts/validate-predictions.mjs public/predictions.json --require-timestamp

      - name: Build static export
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # GA4 — définir la variable de dépôt "NEXT_PUBLIC_GA_ID"
          # (Settings > Secrets and variables > Actions > Variables).
          # Si absente, le build reste fonctionnel, sans tracking.
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

      - name: Copy routing files
        run: |
          cp public/404.html out/404.html 2>/dev/null || true
          cp out/index.html out/200.html 2>/dev/null || true
          cp public/_redirects out/_redirects 2>/dev/null || true
          cp public/.htaccess out/.htaccess 2>/dev/null || true
          cp public/robots.txt out/robots.txt 2>/dev/null || true
          cp public/sitemap.xml out/sitemap.xml 2>/dev/null || true

      - name: Commit data
        continue-on-error: true
        run: |
          git config --local user.email "bot@bttspredict.com"
          git config --local user.name "BTTSPredict Bot"
          git add public/predictions.json public/win-history.json public/transfers.json public/vip-combos.json public/predictions-archive/
          if [ -f public/team-context.json ]; then git add public/team-context.json; fi
          if [ -d public/team-media ]; then git add public/team-media/; fi
          git diff --staged --quiet || git commit -m "chore: auto-update data"
          git push || echo "No changes"

      - name: Install lftp (for FTP cleanup)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Free server disk (purge stale _next/, match/ and archives)
        continue-on-error: true
        timeout-minutes: 90
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          # Le serveur LWS a un quota disque limité (erreurs "553 Disk quota
          # exceeded" le 15/09/2026). Sans --delete sur le miroir principal, les
          # builds précédents (_next/<buildId>/ + chunks hashés) et les pages
          # /match/ éphémères (14 jours par design) s'accumulaient sans jamais
          # être supprimés — l'ancien step de nettoyage n'a d'ailleurs jamais
          # fonctionné (listing `cls` impossible sur ce serveur).
          # Stratégie : miroir inverse ciblé avec --delete, limité aux seuls
          # répertoires dont tout le contenu est généré par le build. Tout
          # fichier distant absent du build local y est supprimé.
          purge() {
            local src="$1" dst="$2" min="$3"
            local count
            count=$(find "$src" -type f 2>/dev/null | wc -l)
            if [ "$count" -lt "$min" ]; then
              echo "⏭️ Skip $dst (build local insuffisant: $count fichiers)"
              return 0
            fi
            echo "🧹 Purge $dst — suppression de tout ce qui n'est plus dans le build"
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
              set ssl:verify no
              set net:timeout 60
              set net:max-retries 3
              mirror --reverse --delete --no-perms --verbose --parallel=2 $src $dst
              bye
            " || echo "⚠️ Purge $dst: erreur ignorée (le déploiement continue)"
          }
          purge out/_next/ ./_next/ 10
          purge out/match/ ./match/ 10
          purge out/en/match/ ./en/match/ 10
          purge out/ar/match/ ./ar/match/ 10
          purge out/predictions-archive/ ./predictions-archive/ 60
          echo "✓ Purge terminée"

      - name: Deploy to bttspredict.com via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          # Synchronisation explicite du build statique vers la racine du site.
          # Sans --delete : aucun fichier distant non lié au build n'est supprimé
          # (la purge ciblée est faite par le step précédent).
          # Parallel=1 + retries élevés pour éviter les 550 race conditions
          # lors de la création des nouveaux dossiers /match/...
          # .htaccess est EXCLU du miroir : le serveur refuse l'écrasement STOR
          # (553 Permission denied) ce qui faisait échouer tout le déploiement
          # malgré un transfert de site complet. Il est déployé par le step
          # suivant via rm + rename.
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
            set ssl:verify no
            set net:timeout 60
            set net:max-retries 5
            set mirror:use-pget-n 1
            mirror --reverse --no-perms --overwrite --verbose --parallel=1 --exclude '^\\.htaccess$' out/ ./
            bye
          "

      - name: Deploy .htaccess (rm + rename — évite le 553 Permission denied)
        continue-on-error: true
        timeout-minutes: 5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          # Le .htaccess distant refuse l'écrasement direct (STOR → 553 Permission
          # denied depuis le 15/09/2026). Comme rm ne dépend que des droits du
          # répertoire parent (pas des permissions du fichier), on uploade sous un
          # nom temporaire, on supprime l'ancien puis on renomme.
          if lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
            set ssl:verify no
            set net:timeout 60
            set net:max-retries 3
            rm -f ./.htaccess.deploy
            put out/.htaccess -o ./.htaccess.deploy
            rm -f ./.htaccess
            mv ./.htaccess.deploy ./.htaccess
            bye
          "; then
            echo "✓ .htaccess déployé (upload temporaire + rm + rename)"
          else
            echo "⚠️ rm+rename refusé — tentative STOR direct"
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
              set ssl:verify no
              set net:timeout 60
              set net:max-retries 3
              put out/.htaccess -o ./.htaccess
              bye
            " \
              || echo "::warning::.htaccess non déployable via FTP — corriger chmod/propriétaire côté LWS (ou supprimer le fichier via le panel)"
          fi

      - name: Notify Bing via IndexNow
        if: success()
        run: node scripts/submit-indexnow.mjs
        continue-on-error: true
